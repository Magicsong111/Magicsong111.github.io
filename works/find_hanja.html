<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄金矿工</title>
    <style>
        /* 全局样式 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #01a285;
        }

        .container {
            display: flex;
            width: 80%;
            height: 80%;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .left-side {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #ccc;
            position: relative; /* 添加相对定位 */
        }

        .image-placeholder {
            font-size: 48px;
            font-weight: bold;
            width: 100%; /* 占据左侧区域的整个宽度 */
            height: 100%; /* 占据左侧区域的整个高度 */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* 防止图片超出容器 */
            background-color: white; /* 切换时显示空白 */
        }

        .image-placeholder img {
            width: 100%; /* 图片宽度填满容器 */
            height: 100%; /* 图片高度填满容器 */
            object-fit: contain; /* 保持图片的宽高比 */
        }

        .right-side {
            width: 50%;
            padding: 20px;
        }

        .action-buttons {
            display: flex;
            /* justify-content: space-between; */
            margin-bottom: 20px;
        }

        .button {
            background-color: white;
            border: 1px solid #000;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #000;
            text-align: center;
            cursor: pointer;
            background-repeat: "";
        }

        .button:hover {
            background-color: #f0f0f0;
        }

        .download {
            background-color: #3fcd0c; /* 设置背景颜色 */
            border: 1px solid #000; /* 设置边框颜色 */
            padding: 10px 20px; /* 设置内边距 */
            border-radius: 10px; /* 设置边框圆角 */
            font-size: 16px; /* 设置字体大小 */
            font-weight: bold; /* 设置字体粗细 */
            color: white; /* 设置文字颜色 */
            text-align: center; /* 设置文字对齐方式 */
            cursor: pointer; /* 设置鼠标悬停时的光标样式 */
            background-repeat: ""; /* 设置背景重复方式 */
        }

        .download:hover {
            background-color: #3ad800ad; /* 设置鼠标悬停时的背景颜色 */
        }

        .bilibili {
            background-color: #ff6597; /* 设置背景颜色 */
            border: 1px solid #000; /* 设置边框颜色 */
            padding: 10px 20px; /* 设置内边距 */
            border-radius: 10px; /* 设置边框圆角 */
            font-size: 16px; /* 设置字体大小 */
            font-weight: bold; /* 设置字体粗细 */
            color: white; /* 设置文字颜色 */
            text-align: center; /* 设置文字对齐方式 */
            cursor: pointer; /* 设置鼠标悬停时的光标样式 */
            background-repeat: ""; /* 设置背景重复方式 */
        }

        .bilibili:hover {
            background-color: #ff6596b8; /* 设置鼠标悬停时的背景颜色 */
        }

        .content-box {
            border: 1px solid #000;
            padding: 20px;
            border-radius: 5px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .content-text {
            font-size: 18px;
            text-align: left;
        }

        .arrow {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        .arrow.left {
            left: 50%;
            position: absolute; /* 绝对定位 */
            top: 50%;
            left: 0px;
            margin-top: -25px;
        }

        .arrow.right {
            right: 50%;
            position: absolute; /* 绝对定位 */
            top: 50%;
            right: 0px;
            margin-top: -25px;
        }
    </style>

        function change(dir) {
            index += dir;
            if (index < 0)
                index = length - 1;
            if (index >= length)
                index = 0;

            const img = document.getElementById("image");
            const newSrc = images[index];

            // 先切换成空白
            img.src = '';

            // 创建新的图片对象并监听加载完成事件
            const newImg = new Image();
            newImg.onload = function() {
                img.src = newSrc;
            };
            newImg.onerror = function() {
                // 如果图片加载失败，可以在这里处理错误
                console.error("Failed to load image: " + newSrc);
            };
            newImg.src = newSrc;
        }

        window.onload = () => {document.getElementById("image").src = images[0];}
