<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>小工具</title>
    <style>
        /* 全局样式 */
        body {
            font-family: Arial, sans-serif;
            background-color: #009479; /* 设置背景色为绿色 */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* 确保身体至少占满整个视口高度 */
        }

        .card-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px;
            width: 100%;
            max-width: 600px; /* 设置最大宽度 */
            overflow-x: hidden;
            overflow-y: auto; /* 确保垂直溢出时出现滚动条 */
            height: calc(100vh - 150px); /* 确保容器高度不超过视口高度 */
        }

        .card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s;
            width: calc(100% - 70px);  /* 修改为动态宽度，左右保留10px间距 */
            height: 100px;
            display: flex;
            align-items: center;      /* 垂直居中 */
            justify-content: center;  /* 水平居中 */
            margin: 10px;
        }

        .card:hover {
            transform: scale(1.1); /* 增加悬停时的放大效果 */
        }

        .card a {
            color: #333;
            text-decoration: none; /* 这行代码已经移除了下划线 */
            font-size: 18px; /* 增加字体大小 */
            text-align: center;
        }
    </style>
</head>
