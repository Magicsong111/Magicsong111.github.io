<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小工具</title>
    <style>
        /* 全局重置 */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #009479;
            margin: 0;
            padding: 20px 10px;
            /* 让页面自然滚动，不限制高度 */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 页面标题 */
        .page-title {
            color: #fff;
            font-size: 32px;
            margin: 0 0 10px 0;
            text-align: center;
        }

        /* 卡片容器 — 不再限制高度，由内容撑开 */
        .card-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            padding: 0 10px;
            /* 容器自身不滚动，滚动交给页面 */
        }

        /* 每张卡片 */
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            width: 100%;
            min-height: 100px;
            /* 保证最小高度，内容多时自动撑高 */
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            padding: 16px 20px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            text-align: center;
        }

        .card:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
        }

        /* 卡片中的链接 */
        .card a {
            color: #222;
            text-decoration: none;
            font-size: 17px;
            line-height: 1.6;
            display: block;
            width: 100%;
        }

        .card a b {
            font-size: 19px;
            display: inline-block;
            margin-bottom: 2px;
        }

        /* 小字描述 */
        .card a .desc {
            font-size: 14px;
            color: #555;
            display: block;
            margin-top: 2px;
        }

        /* 响应式微调 */
        @media (max-width: 480px) {
            .card {
                min-height: 80px;
                padding: 12px 16px;
            }
            .card a {
                font-size: 15px;
            }
            .card a b {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

    <h1 class="page-title">小工具</h1>

    <div class="card-container">

        <div class="card">
            <a href="./Paper Minecraft v11.7 (Minecraft 2D).html">
                <b>Paper Minecraft v11.7</b>
                <span class="desc">Minecraft 2D · 汉化版（有 BUG）</span>
            </a>
        </div>

        <div class="card">
            <a href="./Minecraft Gift Code Generator.zip">
                <b>Minecraft Gift Code Generator</b>
                <span class="desc">国际版礼品码生成器（已失效）</span>
            </a>
        </div>

        <div class="card">
            <a href="./百度网盘在线观看-2025-10-19.user.js">
                <b>百度网盘视频在线观看</b>
                <span class="desc">油猴插件 · 无需下载，转存即看</span>
            </a>
        </div>

        <div class="card">
            <a href="./m3u8Listener.html">
                <b>m3u8Listener</b>
                <span class="desc">将 m3u8 以纯音频形式播放</span>
            </a>
        </div>

        <div class="card">
            <a href="./CCTV-Listener/index.html">
                <b>CCTV-Listener</b>
                <span class="desc">在线听央视节目单</span>
            </a>
        </div>

        <div class="card">
            <a href="cs_exception.html">
                <b>C# 异常表</b>
                <span class="desc">速查异常类型</span>
            </a>
        </div>

        <div class="card">
            <a href="./KemonoFriendsTextGenerator/index.html">
                <b>兽娘动物园风格文字生成器</b>
                <span class="desc">支持两种风格转换</span>
            </a>
        </div>

    </div>

</body>
</html>
