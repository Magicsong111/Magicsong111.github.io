    <style>
        /* ========== 字体定义（合并） ========== */
        @font-face {
            font-family: 'japarifont-zh';
            src: url('japarifont.woff');
        }
        @font-face {
            font-family: 'japarifont-en';
            src: url('Moji_Heavy.otf');
        }
        @font-face {
            font-family: 'japarifont_cn';
            src: url('HelloFont-BangBangTi.ttf');
        }
        @font-face {
            font-family: 'DejimaMincho';
            src: url('dejima-mincho-r227.ttf');
        }
        @font-face {
            font-family: 'SourceHanSerif';
            src: url('SourceHanSerifCN-Bold.otf');
        }
        @font-face {
            font-family: 'PlayBold';
            src: url('Play-Bold.ttf');
        }

        /* ========== 全局重置 ========== */
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: "微软雅黑", "黑体", "楷体", sans-serif;
        }

        /* ========== 主容器 ========== */
        .container {
            max-width: 900px;
            margin: 10px auto;
            padding: 20px;
            background: #2d2d2d;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        /* ========== 预览区 ========== */
        .preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        .preview img#result {
            max-width: 100%;
            height: auto;
            border: 6px solid transparent;
            border-radius: 12px;
            transition: border 0.3s;
            background: #222;
        }
        .preview img#result:hover {
            border-color: #ffe663;
        }

        /* 隐藏原有的 .top / .bottom / .middle 结构（实际由canvas绘制，仅保留样式兼容） */
        .top, .bottom, .middle { display: none; }

        /* ========== 输入区 ========== */
        .inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .inputs span {
            color: #ffad65;
            text-shadow: 0 0 8px black;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
        }
        .inputs input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 1.1rem;
            text-align: center;
            border: none;
            border-radius: 10px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            outline: none;
            transition: background 0.2s;
        }
        .inputs input[type="text"]:focus {
            background: rgba(30,30,30,0.9);
        }

        /* ========== 控制栏（风格切换 + 下载按钮） ========== */
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 6px 0 10px 0;
        }
        .style-switcher {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            text-shadow: 0 0 6px black;
            font-weight: bold;
        }
        .style-switcher button {
            background: rgba(0,0,0,0.6);
            border: 2px solid #ffe663;
            color: #ffe663;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            font-size: 0.95rem;
        }
        .style-switcher button.active {
            background: #ffe663;
            color: #222;
        }
        .style-switcher button:hover {
            background: #ffe663;
            color: #222;
        }

        .download-btn {
            background: rgba(0,0,0,0.7);
            border: 2px solid #fff;
            color: #fff;
            padding: 6px 24px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: lighter;
            cursor: pointer;
            transition: 0.2s;
            font-family: japarifont_cn, japarifont-en, sans-serif;
        }
        .download-btn:hover {
            background: #ffe663;
            color: #222;
            border-color: #ffe663;
        }

        /* ========== 提示信息 ========== */
        .inputs p {
            color: #ccc;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            margin: 4px 0;
            text-align: center;
            font-size: 0.95rem;
        }
        .inputs p a {
            color: #ffad65;
            text-decoration: none;
        }
        .inputs p a:hover {
            text-decoration: underline;
        }

        /* ========== 页脚 ========== */
        footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #444;
            color: #aaa;
            text-shadow: 0 0 8px black;
            text-align: center;
            font-size: 0.85rem;
            font-family: PlayBold, sans-serif;
        }
        footer a {
            color: #ffad65;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
            color: #ffe663;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 600px) {
            .container {
                margin: 8px;
                padding: 15px;
            }
            .controls {
                flex-direction: column;
                gap: 10px;
            }
            .style-switcher {
                flex-wrap: wrap;
                justify-content: center;
            }
            .inputs input[type="text"] {
                font-size: 1rem;
                padding: 10px;
            }
            .download-btn {
                width: 100%;
                text-align: center;
            }
            footer {
                font-size: 0.75rem;
            }
        }

        /* ========== 工具类 ========== */
        .noselect {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
<script>document.body.style.zoom = '75%';</script>
<div class="container">
    <!-- 预览 -->
    <div class="preview noselect">
        <img id="result" alt="Logo预览" />
    </div>

    <!-- 输入与控制 -->
    <div class="inputs">
        <span>↓ 输入文字（顶部 · 主标题 · 底部）</span>
        <input id="top" type="text" placeholder="顶部文字" />
        <input id="middle" type="text" placeholder="中间主标题" />
        <input id="bottom" type="text" placeholder="底部英文" />

        <!-- 控制栏 -->
        <div class="controls">
            <div class="style-switcher">
                <span>字体风格：</span>
                <button id="style-zh" class="active">一期</button>
                <button id="style-en">兽3</button>
            </div>
            <button id="download" class="download-btn">⬇ 下载Logo</button>
        </div>

        <p>长按预览图可分享（移动端） · 切换风格将重置示例文本</p>
    </div>

    <!-- 页脚 -->
    <footer>
        <p>
            Powered by 
            <a target="_blank" href="http://getsuren.com/killgoU.html">キルゴU</a>, 
            <a target="_blank" href="https://code.google.com/archive/p/dejima-fonts/">出島明朝</a>,
            <a target="_blank" href="https://fonts.google.com/specimen/Play">Play</a>,
            <a target="_blank" href="https://flic.kr/p/76RaWE">Savanna</a> and Friends.
            <br>
            Author: <a href="https://twitter.com/cubbit2">@cubbit2</a> · 
            KF1: <a href="http://github.com/yanstory">Yanstime</a> · 
            KF3: <a href="https://codeberg.org/Notritsu">Notritsu</a>
        </p>
    </footer>
</div>

<script>
    // ========== 核心JS（与之前一致，仅微调初始化） ==========
    window.onload = function() {
        var seed = {
            x: (2147483648 * Math.random()) | 0,
            y: (2147483648 * Math.random()) | 0,
            z: (2147483648 * Math.random()) | 0,
            w: (2147483648 * Math.random()) | 0
        };
        function randomInt(xors) {
            var t = xors.x ^ (xors.x << 11);
            xors.x = xors.y;
            xors.y = xors.z;
            xors.z = xors.w;
            return xors.w = (xors.w ^ (xors.w >>> 19)) ^ (t ^ (t >>> 8));
        }
        function random(xors) {
            return randomInt(xors) / 2147483648;
        }
        function shuffle(xs) {
            var v = Object.assign({}, seed);
            var xs = xs.slice();
            var ys = [];
            while (0 < xs.length) {
                var i = Math.abs(randomInt(v)) % xs.length;
                ys.push(xs[i]);
                xs.splice(i, 1);
            }
            return ys;
        }

        var colorTuples = shuffle([
            ["#16ae67", "#90c31f"],
            ["#ea5421", "#f39800"],
            ["#00ac8e", "#e4007f"],
            ["#227fc4", "#00a1e9"],
            ["#9fa0a0", "#c9caca"],
            ["#e60013", "#f39800"],
            ["#c3d600", "#a42e8c"]
        ]);
        var topColors = shuffle([
            "#04ad8f", "#a6ce48", "#f3a118", "#ea6435", "#17b297",
            "#e30983", "#2782c4", "#1aa6e7", "#b5b5b5", "#f29905",
            "#e50011", "#ccdc26", "#a5328d", "#0aaa60", "#91c423",
            "#f29300", "#ec5f69", "#22b69e", "#e63e9b", "#917220"
        ]);

        var topInput = document.querySelector("#top");
        var middleInput = document.querySelector("#middle");
        var bottomInput = document.querySelector("#bottom");
        var image = document.getElementById("result");
        var download = document.getElementById("download");
        var canvas = document.createElement("canvas");
        var g = canvas.getContext("2d");

        var currentStyle = 'zh';

        function getFonts(style) {
            if (style === 'zh') {
                return {
                    top: '"DejimaMincho"',
                    middle: '"japarifont-zh"',
                    bottom: 'PlayBold'
                };
            } else {
                return {
                    top: '"SourceHanSerif", sans-serif',
                    middle: '"japarifont-en", "japarifont_cn", sans-serif',
                    bottom: 'PlayBold'
                };
            }
        }

        function getDefaultTexts(style) {
            if (style === 'zh') {
                return {
                    top: '女の子の姿になった動物たちが繰り広げる大冒険！',
                    middle: 'けものフレンズ',
                    bottom: 'KEMONO FRIENDS'
                };
            } else {
                return {
                    top: '女の子の姿になった動物たちが繰り広げる大冒険！',
                    middle: 'けも●フレンズ',
                    bottom: 'KEMONO FRIENDS'
                };
            }
        }

        function setText(topText, middleText, bottomText, style) {
            style = style || currentStyle;
            if (style === 'zh' && window.dictionary && typeof window.dictionary === 'object') {
                middleText = middleText.split('').map(function(ch) {
                    return window.dictionary[ch]?.[0] || ch;
                }).join('');
            }
            var fonts = getFonts(style);

            var topTextSize = 30;
            var topMiddlePadding = 30;
            var middleTextSize = 120;
            var middleBottomPadding = 20;
            var bottomTextSize = 30;
            var margin = 60;
            var bottomTextLetterSpacing = 20;

            var topTextFont = `normal bold ${topTextSize}px/2 ${fonts.top}`;
            var middleTextFont = `normal 400 ${middleTextSize}px/2 ${fonts.middle}`;
            var bottomTextFont = `normal 400 ${bottomTextSize}px/2 ${fonts.bottom}`;

            g.font = topTextFont;
            var topMetrics = g.measureText(topText);
            g.font = middleTextFont;
            var middleMetrics = g.measureText(middleText);
            g.font = bottomTextFont;
            var bottomMetrics = g.measureText(bottomText);
            canvas.width = margin + Math.max(
                topMetrics.width,
                middleMetrics.width,
                bottomMetrics.width + bottomTextLetterSpacing * (bottomText.length - 1)
            ) + margin;
            canvas.height = margin + topTextSize + topMiddlePadding + middleTextSize + middleBottomPadding + bottomTextSize + margin;

            g.save();
            g.clearRect(0, 0, canvas.width, canvas.height);
            g.textBaseline = "top";

            // 顶部文字
            function iterate(callback) {
                var xors = Object.assign({}, seed);
                g.save();
                g.font = topTextFont;
                g.fillStyle = "white";
                g.strokeStyle = "white";
                g.lineJoin = "round";
                g.lineWidth = 10.0;
                var metrics = g.measureText(topText);
                g.translate(margin + (canvas.width - metrics.width - margin * 2) * 0.5, margin);
                for (var i = 0; i < topText.length; i++) {
                    var c = topText.slice(i, i + 1);
                    var rot = random(xors) * 0.2;
                    var m = g.measureText(c);
                    g.save();
                    g.translate(m.width * 0.5, topTextSize * 0.5);
                    g.rotate(rot);
                    g.translate(-m.width * 0.5, -topTextSize * 0.5);
                    callback(i, c);
                    g.restore();
                    g.translate(m.width, 0);
                }
                g.restore();
            }
            g.save();
            iterate(function(i, c) {
                g.shadowColor = "transparent";
                g.strokeText(c, 0, 0);
            });
            iterate(function(i, c) {
                g.shadowColor = "rgba(0, 0, 0, 0.3)";
                g.shadowBlur = 10;
                g.fillStyle = topColors[i % topColors.length];
                g.fillText(c, 0, 0);
            });
            g.restore();

            // 中间
            var metrics = g.measureText(middleText);
            g.translate((canvas.width - middleMetrics.width) * 0.5, margin + topTextSize + topMiddlePadding);

            g.font = middleTextFont;
            g.strokeStyle = "white";
            g.lineWidth = 20.0;
            g.shadowColor = "rgba(0, 0, 0, 0.3)";
            g.shadowBlur = 10;
            g.lineCap = "round";
            g.lineJoin = "round";
            g.strokeText(middleText, 0, 0);

            var xors = Object.assign({}, seed);
            for (var i = 0; i < middleText.length; i++) {
                var c = middleText.slice(i, i + 1);
                g.shadowColor = "rgba(0, 0, 0, 0.6)";
                g.shadowBlur = 10;
                g.fillStyle = colorTuples[i % colorTuples.length][0];
                g.fillText(c, 0, 0);

                g.save();
                var rot = random(xors);
                g.beginPath();
                g.save();
                g.translate(middleTextSize * 0.5, middleTextSize * 0.5);
                g.rotate(rot);
                g.translate(-middleTextSize * 0.5, -middleTextSize * 0.5);
                g.moveTo(-middleTextSize * 2, middleTextSize * 0.5);
                g.lineTo(middleTextSize * 2, middleTextSize * 0.5);
                g.lineTo(middleTextSize * 2, middleTextSize * 2);
                g.lineTo(-middleTextSize * 2, middleTextSize * 2);
                g.closePath();
                g.restore();
                g.clip();

                g.shadowColor = "none";
                g.shadowBlur = 0;
                g.fillStyle = colorTuples[i % colorTuples.length][1];
                g.fillText(c, 0, 0);
                g.restore();

                var m = g.measureText(c);
                g.translate(m.width, 0);
            }
            g.restore();

            // 底部
            g.save();
            g.strokeStyle = "white";
            g.fillStyle = "#977a2d";
            g.lineWidth = 13.0;
            g.lineCap = "round";
            g.lineJoin = "round";
            g.textBaseline = "top";
            g.font = bottomTextFont;

            var metrics2 = g.measureText(bottomText);
            g.translate(
                (canvas.width - metrics2.width - (bottomText.length - 1) * bottomTextLetterSpacing) * 0.5,
                margin + topTextSize + topMiddlePadding + middleTextSize + middleBottomPadding
            );
            for (var j = 0; j < bottomText.length; j++) {
                var ch = bottomText.slice(j, j + 1);
                g.shadowColor = "rgba(0, 0, 0, 0.3)";
                g.shadowBlur = 10;
                g.strokeText(ch, 0, 0);
                g.shadowColor = "transparent";
                g.fillText(ch, 0, 0);
                var m2 = g.measureText(ch);
                g.translate(m2.width + bottomTextLetterSpacing, 0);
            }
            g.restore();

            var url = canvas.toDataURL();
            image.src = url;
            download.href = url;
        }

        function update() {
            setTimeout(function() {
                setText(topInput.value, middleInput.value, bottomInput.value, currentStyle);
            }, 0);
        }

        function setStyle(style) {
            currentStyle = style;
            document.getElementById('style-zh').classList.toggle('active', style === 'zh');
            document.getElementById('style-en').classList.toggle('active', style === 'en');
            var defaults = getDefaultTexts(style);
            topInput.value = defaults.top;
            middleInput.value = defaults.middle;
            bottomInput.value = defaults.bottom;
            update();
        }

        topInput.addEventListener('input', update);
        middleInput.addEventListener('input', update);
        bottomInput.addEventListener('input', update);

        document.getElementById('style-zh').addEventListener('click', function() { setStyle('zh'); });
        document.getElementById('style-en').addEventListener('click', function() { setStyle('en'); });

        download.addEventListener('click', function() {
            canvas.toBlob(function(blob) {
                saveAs(blob, middleInput.value + '.png');
            });
        });

        // 默认中文
        const fontNames = [
            'japarifont-zh', 'japarifont-en', 'japarifont_cn',
            'DejimaMincho', 'SourceHanSerif', 'PlayBold'
        ];
        Promise.all(fontNames.map(name => document.fonts.load(`1em ${name}`)))
            .then(() => setStyle('zh'));
    };
</script>
</body>
</html>
